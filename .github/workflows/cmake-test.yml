name: CMake Build for ZPG Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release  # Typ buildu (Release, Debug atd.), můžeš změnit podle potřeby

jobs:
  build:
    runs-on: ubuntu-latest  # Běží na Ubuntu, jako tvůj setup

    steps:
    - uses: actions/checkout@v4  # Stáhne tvůj kód z repozitáře

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libglfw3-dev libglew-dev libglm-dev libassimp-dev libsoil-dev libgl1-mesa-dev pkg-config cmake

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: |
        cd build
        cmake --build . --config ${{env.BUILD_TYPE}}

    - name: Test (optional)
      working-directory: build
      run: ctest -C ${{env.BUILD_TYPE}}  # Pokud nemáš testy, tento krok smaž nebo zakomentuj
